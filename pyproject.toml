[project]
name = "jev-stortinget"
version = "0.1.0"
description = "Jev judges whether ministers answered Storting's written questions, code decides. Companion code for an article."
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6",
    "typesafe-sdk>=0.7.1",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jev_stortinget"]

[tool.pytest.ini_options]
testpaths = ["tests"]
